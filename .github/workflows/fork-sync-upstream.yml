name: Sync fork with upstream

on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:

# The dedicated token needs Contents and Workflows write access to this fork.
# GITHUB_TOKEN cannot sync upstream changes to workflow files.
permissions: {}

concurrency:
  group: fork-sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'medking82/firecrawl' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge upstream into the fork
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          EXPECTED_UPSTREAM: firecrawl/firecrawl
          SYNC_BRANCH: main
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Set UPSTREAM_SYNC_TOKEN with Contents and Workflows write access to $GH_REPOSITORY."
            exit 1
          fi

          actual_upstream="$(gh api "repos/$GH_REPOSITORY" --jq '.parent.full_name')"
          if [[ "$actual_upstream" != "$EXPECTED_UPSTREAM" ]]; then
            echo "::error::The fork's upstream changed. Review the source before syncing."
            exit 1
          fi

          # GitHub merges without rewriting fork commits; conflicts stop the run.
          gh api \
            --method POST \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GH_REPOSITORY/merge-upstream" \
            --field "branch=$SYNC_BRANCH"

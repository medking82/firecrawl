name: Sync fork with upstream

on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:

# This token must trigger push CI: Contents/Workflows write and Checks read.
# GITHUB_TOKEN pushes do not trigger the candidate's required LF job.
permissions: {}

concurrency:
  group: fork-sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'medking82/firecrawl' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate sync token and upstream
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Set UPSTREAM_SYNC_TOKEN with Contents/Workflows write and Checks read access to $GH_REPOSITORY."
            exit 1
          fi
          actual_upstream="$(gh api "repos/$GH_REPOSITORY" --jq '.parent.full_name')"
          if [[ "$actual_upstream" != firecrawl/firecrawl ]]; then
            echo "::error::The fork's upstream changed. Review the source before syncing."
            exit 1
          fi

      - name: Checkout fork history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Publish candidate, require LF success, then fast-forward main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          FIRECRAWL_SYNC_REPOSITORY: ${{ github.repository }}
          FIRECRAWL_UPDATE_STATE_DIR: ${{ runner.temp }}/firecrawl-fork-sync
        run: |
          set -Eeuo pipefail
          git remote add upstream https://github.com/firecrawl/firecrawl.git
          mkdir -m 700 -p "$FIRECRAWL_UPDATE_STATE_DIR"
          source deployment/firecrawl-updater/deployment/firecrawl_update.sh
          sync_fork_main

      - name: Preserve sync evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fork-sync-evidence
          path: |
            ${{ runner.temp }}/firecrawl-fork-sync/fork-sync.*/snapshots
            ${{ runner.temp }}/firecrawl-fork-sync/fork-sync.*/lf-check-runs.json
          if-no-files-found: ignore
